name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) Build CI: the rmtt Rust crate itself (fmt / clippy / build / test).
  # ---------------------------------------------------------------------------
  rust:
    name: rust (${{ matrix.feature }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - feature: default
            args: --all-features
          - feature: no-default
            args: --no-default-features
          - feature: client-only
            args: --no-default-features --features client
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: matrix.feature == 'default'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.feature == 'default'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build
        run: cargo build ${{ matrix.args }}

      - name: cargo test
        run: cargo test ${{ matrix.args }}

  # ---------------------------------------------------------------------------
  # 2) Language matrix: build every cross-language E2E component.
  #    - java-server : Maven project, parent net.czqu.rmtt:rmtt-java-parent:1.0.1
  #    - go-client   : Go module requiring github.com/czqu/rmtt-go v1.0.2
  #    - rust-client : this repository's crate (path dependency)
  # ---------------------------------------------------------------------------
  e2e-build:
    name: e2e build (${{ matrix.component }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [java-server, go-client, rust-client]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        if: matrix.component == 'java-server'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build java-server (rmtt-java-parent 1.0.1)
        if: matrix.component == 'java-server'
        run: mvn -B -ntp -f e2e/java-server/pom.xml clean package

      - name: Upload java-server jar
        if: matrix.component == 'java-server'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-java-server
          path: e2e/java-server/target/rmtt-e2e-java-server.jar
          if-no-files-found: error

      - name: Set up Go
        if: matrix.component == 'go-client'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Build go-client (rmtt-go v1.0.2)
        if: matrix.component == 'go-client'
        working-directory: e2e/go-client
        run: go build -o ../bin/go-client .

      - name: Upload go-client binary
        if: matrix.component == 'go-client'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-go-client
          path: e2e/bin/go-client
          if-no-files-found: error

      - name: Set up Rust
        if: matrix.component == 'rust-client'
        uses: dtolnay/rust-toolchain@stable

      - name: Build rust-client (local crate)
        if: matrix.component == 'rust-client'
        working-directory: e2e/rust-client
        run: cargo build --release

      - name: Upload rust-client binary
        if: matrix.component == 'rust-client'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rust-client
          path: e2e/rust-client/target/release/rmtt-rust-e2e
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) End-to-end test: Java server x each client (go, rust).
  #    run_e2e.sh starts the Java server, waits for E2E_SERVER_READY, then runs
  #    the client and requires its PASS marker.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (java-server x ${{ matrix.client }})
    runs-on: ubuntu-latest
    needs: e2e-build
    strategy:
      fail-fast: false
      matrix:
        client: [go, rust]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download java-server jar
        uses: actions/download-artifact@v4
        with:
          name: e2e-java-server
          path: artifacts/java-server

      - name: Download go-client binary
        if: matrix.client == 'go'
        uses: actions/download-artifact@v4
        with:
          name: e2e-go-client
          path: artifacts/go-client

      - name: Download rust-client binary
        if: matrix.client == 'rust'
        uses: actions/download-artifact@v4
        with:
          name: e2e-rust-client
          path: artifacts/rust-client

      # Assemble the downloaded artifacts into the exact paths run_e2e.sh
      # expects (upload/download may preserve directory prefixes).
      - name: Assemble e2e binaries
        run: |
          set -euo pipefail
          mkdir -p e2e/java-server/target e2e/bin e2e/rust-client/target/release
          jar=$(find artifacts/java-server -type f -name 'rmtt-e2e-java-server.jar' | head -1)
          [ -n "$jar" ]
          cp "$jar" e2e/java-server/target/rmtt-e2e-java-server.jar
          if [ "${{ matrix.client }}" = "go" ]; then
            cp "$(find artifacts/go-client -type f | head -1)" e2e/bin/go-client
            chmod +x e2e/bin/go-client
          else
            cp "$(find artifacts/rust-client -type f | head -1)" e2e/rust-client/target/release/rmtt-rust-e2e
            chmod +x e2e/rust-client/target/release/rmtt-rust-e2e
          fi

      - name: Run E2E (java-server x ${{ matrix.client }})
        run: bash e2e/run_e2e.sh ${{ matrix.client }}
